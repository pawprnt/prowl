name: Build Prowl Image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  OUTPUT_NAME: "prowl-image"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto

      - name: Build image
        run: |
          cd nixos
          nix build .#prowl-kali --option sandbox false --verbose 2>&1 | tail -100

      - name: Prepare image
        run: |
          mkdir -p build/images
          cp -r nixos/result/share/qemu/* build/images/ 2>/dev/null || \
          cp -r nixos/result/bin/* build/images/ 2>/dev/null || \
          find nixos/result -name "*.qcow2" -o -name "*.img" | head -1 | xargs -I{} cp {} build/images/

          IMAGE=$(find build/images -name "*.qcow2" -o -name "*.img" | head -1)
          if [ -z "$IMAGE" ]; then
            echo "No image found"
            exit 1
          fi

          echo "Image: $IMAGE"
          ls -la build/images/

      - name: Compress image
        run: |
          IMAGE=$(find build/images -name "*.qcow2" -o -name "*.img" | head -1)
          echo "Converting to final QCOW2..."
          qemu-img convert -f qcow2 -O qcow2 -c \
            -o compression_type=zlib,cluster_size=65536 \
            "$IMAGE" \
            "${{ env.OUTPUT_NAME }}.qcow2"

          echo "Final size: $(du -h ${{ env.OUTPUT_NAME }}.qcow2 | cut -f1)"

      - name: Split for GitHub release
        run: |
          mkdir -p splits
          rm -f splits/*
          split -b 1800M -d -a 3 \
            "${{ env.OUTPUT_NAME }}.qcow2" \
            "splits/${{ env.OUTPUT_NAME }}.part."

          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          echo "Split into $PARTS parts, total: $SIZE"

      - name: Generate manifest
        run: |
          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          cat > splits/manifest.json << EOF
          {
            "name": "${{ env.OUTPUT_NAME }}",
            "version": "${{ github.ref_name || 'dev' }}",
            "commit": "$(git rev-parse --short HEAD)",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "parts": $PARTS,
            "max_part_size": "1800M",
            "total_size": "$SIZE",
            "base": "nixos-unstable"
          }
          EOF

      - name: Upload parts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: splits/
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            splits/${{ env.OUTPUT_NAME }}.part.*
            splits/manifest.json
          body: |
            ## Prowl Image ${{ github.ref_name }}

            NixOS-based security research VM with prowl and tools pre-installed.
            Reproducible, declarative, minimal.

            ### Quick Start
            ```bash
            # Reassemble
            cat ${{ env.OUTPUT_NAME }}.part.* > ${{ env.OUTPUT_NAME }}.qcow2

            # Run
            qemu-system-x86_64 -m 4G -smp 2 -enable-kvm \
              -drive file=${{ env.OUTPUT_NAME }}.qcow2,format=qcow2 \
              -net user,hostfwd=tcp::2222-:22 -net nic

            # SSH
            ssh prowl@localhost -p 2222
            ```
          draft: false
          prerelease: false

      - name: Cleanup
        if: always()
        run: |
          rm -rf build/ splits/ *.qcow2 nixos/result
