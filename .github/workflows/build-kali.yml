name: Build Prowl Kali Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      install_tools:
        description: 'Install Kali tools (slower, larger image)'
        required: false
        default: 'true'
        type: boolean

env:
  OUTPUT_NAME: "prowl-kali"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            qemu-utils \
            qemu-system-x86 \
            7zip \
            debos \
            dosfstools \
            zerofree \
            curl \
            jq \
            nbd-client

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build prowl binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name || 'dev' }} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -tags netgo -installsuffix netgo \
            -o prowl-linux-amd64 ./cmd/prowl/
          chmod +x prowl-linux-amd64
          ./prowl-linux-amd64 --version

      - name: Build Kali image with all packages
        run: |
          cd kali/image-build
          sudo ./build.sh \
            -v qemu \
            -f qemu \
            -T none \
            -s 40 \
            -U kali:kali \
            -P "openssh-server qemu-guest-agent nmap masscan nikto whatweb sqlmap hydra john hashcat metasploit-framework burpsuite responder bloodhound binwalk radare2 bettercap mitmproxy testssl.sh curl wget git docker.io jq sshpass \
              kali-tools-web kali-tools-passwords kali-tools-exploitation kali-tools-post-exploitation kali-tools-forensics kali-tools-sniffing-spoofing kali-tools-information-gathering kali-tools-vulnerability kali-tools-social-engineering kali-tools-reverse-engineering kali-tools-wireless kali-tools-fuzzing" \
            -- --artifactdir ../../build/images
          sudo chown -R runner:runner ../../build
          ls -la ../../build/images/

      - name: Prepare image and inject prowl
        run: |
          mkdir -p build
          BASE=$(ls build/images/*.qcow2 2>/dev/null | head -1)
          if [ -z "$BASE" ]; then
            echo "No qcow2 image found"
            exit 1
          fi
          cp "$BASE" build/${{ env.OUTPUT_NAME }}-work.qcow2
          qemu-img resize build/${{ env.OUTPUT_NAME }}-work.qcow2 40G

          echo "Connecting image via nbd..."
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --connect=/dev/nbd0 build/${{ env.OUTPUT_NAME }}-work.qcow2
          sleep 3
          ls /dev/nbd0*

          echo "Mounting root partition..."
          sudo mkdir -p /mnt/image
          # Find the root partition (largest ext4)
          PART=$(lsblk -nrpo NAME,TYPE,FSTYPE /dev/nbd0 2>/dev/null | grep ext4 | head -1 | awk '{print $1}')
          if [ -z "$PART" ]; then
            PART="/dev/nbd0p2"
          fi
          echo "Using partition: $PART"
          sudo mount "$PART" /mnt/image

          echo "Installing prowl binary..."
          sudo cp prowl-linux-amd64 /mnt/image/usr/local/bin/prowl
          sudo chmod +x /mnt/image/usr/local/bin/prowl

          echo "Enabling SSH..."
          sudo chroot /mnt/image systemctl enable ssh

          echo "Bundling bounty-data..."
          sudo mkdir -p /mnt/image/home/kali/.prowl/bounty-data
          sudo cp -r data/bounty-data/* /mnt/image/home/kali/.prowl/bounty-data/
          sudo chown -R 1000:1000 /mnt/image/home/kali/.prowl

          echo "Unmounting..."
          sudo umount /mnt/image
          sudo qemu-nbd --disconnect /dev/nbd0
          sleep 2

          echo "Verifying prowl in image..."
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --connect=/dev/nbd0 build/${{ env.OUTPUT_NAME }}-work.qcow2
          sleep 3
          sudo mkdir -p /mnt/image
          sudo mount /dev/nbd0p2 /mnt/image
          sudo /mnt/image/usr/local/bin/prowl --version || echo "prowl binary exists but can't run here (expected)"
          sudo umount /mnt/image
          sudo qemu-nbd --disconnect /dev/nbd0

      - name: Compress image
        run: |
          echo "Converting to final QCOW2..."
          qemu-img convert -f qcow2 -O qcow2 -c \
            -o compression_type=zlib,cluster_size=65536 \
            "build/${{ env.OUTPUT_NAME }}-work.qcow2" \
            "${{ env.OUTPUT_NAME }}.qcow2"

          echo "Final size: $(du -h ${{ env.OUTPUT_NAME }}.qcow2 | cut -f1)"

      - name: Split for GitHub release
        run: |
          mkdir -p splits
          rm -f splits/*
          split -b ${{ env.MAX_PART_SIZE }} -d -a 3 \
            "${{ env.OUTPUT_NAME }}.qcow2" \
            "splits/${{ env.OUTPUT_NAME }}.part."

          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          echo "Split into $PARTS parts, total: $SIZE"

      - name: Generate manifest
        run: |
          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          cat > splits/manifest.json << EOF
          {
            "name": "${{ env.OUTPUT_NAME }}",
            "version": "${{ github.ref_name || 'dev' }}",
            "commit": "$(git rev-parse --short HEAD)",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "parts": $PARTS,
            "max_part_size": "${{ env.MAX_PART_SIZE }}",
            "total_size": "$SIZE",
            "features": [
              "prowl", "nmap", "nikto", "whatweb", "sqlmap",
              "hydra", "john", "hashcat", "metasploit", "burpsuite",
              "responder", "bloodhound", "binwalk", "radare2",
              "bettercap", "mitmproxy", "testssl"
            ]
          }
          EOF

      - name: Upload parts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-image
          path: splits/
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            splits/${{ env.OUTPUT_NAME }}.part.*
            splits/manifest.json
          body: |
            ## Prowl Kali Image ${{ github.ref_name }}

            Pre-built Kali Linux QEMU image with **prowl** and security tools pre-installed.

            Built from scratch using [kali-vm](https://gitlab.com/kalilinux/build-scripts/kali-vm).

            ### Quick Start
            ```bash
            # Reassemble
            cat ${{ env.OUTPUT_NAME }}.part.* > ${{ env.OUTPUT_NAME }}.qcow2

            # Run
            qemu-system-x86_64 -m 4G -smp 2 -enable-kvm \
              -drive file=${{ env.OUTPUT_NAME }}.qcow2,format=qcow2 \
              -net user,hostfwd=tcp::2222-:22 -net nic

            # SSH
            sshpass -p kali ssh -p 2222 kali@localhost
            ```

            ### Included Tools
            prowl, nmap, nikto, whatweb, sqlmap, hydra, john, hashcat,
            metasploit, burpsuite, responder, bloodhound, binwalk, radare2,
            bettercap, mitmproxy, testssl
          draft: false
          prerelease: false

      - name: Cleanup
        if: always()
        run: |
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          sudo umount /mnt/image 2>/dev/null || true
          sudo rm -rf build/ splits/ *.qcow2
