name: Build Prowl Kali Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Force full rebuild (skip incremental)'
        required: false
        default: 'false'
        type: boolean
      install_tools:
        description: 'Install Kali tools (slower, larger image)'
        required: false
        default: 'true'
        type: boolean

env:
  OUTPUT_NAME: "prowl-kali"
  MAX_PART_SIZE: "1800M"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            qemu-utils \
            qemu-system-x86 \
            libguestfs-tools \
            libvirt-daemon-system \
            libvirt-clients \
            virtinst \
            7zip \
            debos \
            dosfstools \
            zerofree \
            curl \
            jq

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build prowl binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name || 'dev' }} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -tags netgo -installsuffix netgo \
            -o prowl-linux-amd64 ./cmd/prowl/
          chmod +x prowl-linux-amd64
          ./prowl-linux-amd64 --version

      - name: Build base Kali image
        run: |
          cd kali/image-build
          sudo ./build.sh \
            -v qemu \
            -f qemu \
            -T none \
            -s 40 \
            -U kali:kali \
            -P "nmap masscan nikto whatweb sqlmap hydra john hashcat metasploit-framework burpsuite responder bloodhound binwalk radare2 bettercap mitmproxy semgrep curl wget git docker.io jq sshpass testssl" \
            -- --artifactdir ../../build/images
          cd ..
          mkdir -p build/images
          mv images/*.qcow2 build/images/ 2>/dev/null || true
          ls -la build/images/

      - name: Create work image
        run: |
          mkdir -p build
          BASE=$(ls build/images/*.qcow2 images/*.qcow2 2>/dev/null | head -1)
          if [ -z "$BASE" ]; then
            BASE=$(ls images/*.raw 2>/dev/null | head -1)
            qemu-img convert -f raw -O qcow2 "$BASE" build/${{ env.OUTPUT_NAME }}-work.qcow2
          else
            cp "$BASE" build/${{ env.OUTPUT_NAME }}-work.qcow2
          fi
          qemu-img resize build/${{ env.OUTPUT_NAME }}-work.qcow2 40G

      - name: Install prowl
        run: |
          virt-customize -a "build/${{ env.OUTPUT_NAME }}-work.qcow2" \
            --upload "prowl-linux-amd64:/usr/local/bin/prowl" \
            --run-command "chmod +x /usr/local/bin/prowl"

      - name: Bundle bounty-data
        run: |
          virt-customize -a "build/${{ env.OUTPUT_NAME }}-work.qcow2" \
            --run-command "mkdir -p /home/kali/.prowl" \
            --upload "data/bounty-data:/home/kali/.prowl/bounty-data" \
            --run-command "chown -R kali:kali /home/kali/.prowl"

      - name: Install Kali tools
        if: github.event.inputs.install_tools != 'false'
        run: |
          virt-customize -a "build/${{ env.OUTPUT_NAME }}-work.qcow2" \
            --run-command "DEBIAN_FRONTEND=noninteractive apt-get update" \
            --run-command "DEBIAN_FRONTEND=noninteractive apt-get install -y \
              kali-tools-web \
              kali-tools-passwords \
              kali-tools-exploitation \
              kali-tools-post-exploitation \
              kali-tools-forensics \
              kali-tools-sniffing-spoofing \
              kali-tools-information-gathering \
              kali-tools-vulnerability \
              kali-tools-social-engineering \
              kali-tools-reverse-engineering \
              kali-tools-wireless \
              kali-tools-fuzzing" \
            --run-command "apt-get clean"

      - name: Compress image
        run: |
          echo "Sparsifying..."
          virt-sparsify --compress \
            "build/${{ env.OUTPUT_NAME }}-work.qcow2" \
            "build/${{ env.OUTPUT_NAME }}-sparse.qcow2"

          echo "Converting to final QCOW2..."
          qemu-img convert -f qcow2 -O qcow2 -c \
            -o compression_type=zlib,cluster_size=65536 \
            "build/${{ env.OUTPUT_NAME }}-sparse.qcow2" \
            "${{ env.OUTPUT_NAME }}.qcow2"

          echo "Final size: $(du -h ${{ env.OUTPUT_NAME }}.qcow2 | cut -f1)"

      - name: Split for GitHub release
        run: |
          mkdir -p splits
          rm -f splits/*
          split -b ${{ env.MAX_PART_SIZE }} -d -a 3 \
            "${{ env.OUTPUT_NAME }}.qcow2" \
            "splits/${{ env.OUTPUT_NAME }}.part."

          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          echo "Split into $PARTS parts, total: $SIZE"

      - name: Generate manifest
        run: |
          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          cat > splits/manifest.json << EOF
          {
            "name": "${{ env.OUTPUT_NAME }}",
            "version": "${{ github.ref_name || 'dev' }}",
            "commit": "$(git rev-parse --short HEAD)",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "parts": $PARTS,
            "max_part_size": "${{ env.MAX_PART_SIZE }}",
            "total_size": "$SIZE",
            "features": [
              "prowl", "nmap", "nuclei", "httpx", "subfinder", "ffuf",
              "gobuster", "sqlmap", "nikto", "whatweb", "wpscan",
              "hydra", "john", "hashcat", "metasploit", "burpsuite",
              "responder", "bloodhound", "binwalk", "radare2",
              "bettercap", "mitmproxy", "semgrep", "dalfox", "katana", "gau"
            ]
          }
          EOF

      - name: Upload parts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-image
          path: splits/
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            splits/${{ env.OUTPUT_NAME }}.part.*
            splits/manifest.json
          body: |
            ## Prowl Kali Image ${{ github.ref_name }}

            Pre-built Kali Linux QEMU image with **prowl** and security tools pre-installed.

            Built from scratch using [kali-vm](https://gitlab.com/kalilinux/build-scripts/kali-vm).

            ### Quick Start
            ```bash
            # Reassemble
            cat ${{ env.OUTPUT_NAME }}.part.* > ${{ env.OUTPUT_NAME }}.qcow2

            # Run
            qemu-system-x86_64 -m 4G -smp 2 -enable-kvm \
              -drive file=${{ env.OUTPUT_NAME }}.qcow2,format=qcow2 \
              -net user,hostfwd=tcp::2222-:22 -net nic

            # SSH
            ssh kali@localhost -p 2222
            # Password: kali
            ```

            ### Included Tools
            prowl, nmap, nuclei, httpx, subfinder, ffuf, gobuster, sqlmap,
            nikto, whatweb, wpscan, hydra, john, hashcat, metasploit,
            burpsuite, responder, bloodhound, binwalk, radare2,
            bettercap, mitmproxy, semgrep, dalfox, katana, gau
          draft: false
          prerelease: false

      - name: Cleanup
        if: always()
        run: |
          rm -rf build/ splits/ *.qcow2 *.raw images/ kali-vm/
