name: Build Prowl Kali Image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      install_tools:
        description: 'Install security tools'
        required: false
        default: 'true'
        type: boolean
      desktop:
        description: 'Desktop environment'
        required: false
        default: 'xfce'
        type: choice
        options:
          - xfce
          - kde
          - none

env:
  OUTPUT_NAME: "prowl-kali"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            debootstrap \
            qemu-utils \
            qemu-system-x86 \
            fdisk \
            e2fsprogs \
            rsync \
            dosfstools \
            zerofree \
            nbd-client \
            curl \
            jq

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build prowl binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name || 'dev' }} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -tags netgo -installsuffix netgo \
            -o prowl-linux-amd64 ./cmd/prowl/
          chmod +x prowl-linux-amd64
          ./prowl-linux-amd64 --version

      - name: Build minimal Kali image
        run: |
          sudo ./kali/build-minimal.sh \
            -s 30 \
            -U kali:kali \
            -D ${{ github.event.inputs.desktop || 'xfce' }}

      - name: Inject prowl and bounty-data
        run: |
          IMAGE="build/images/prowl-kali.qcow2"
          mkdir -p build/images

          echo "Connecting image via nbd..."
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --connect=/dev/nbd0 "$IMAGE"
          sleep 3

          echo "Partition layout:"
          lsblk -f /dev/nbd0 || true
          for p in /dev/nbd0p*; do
            FSTYPE=$(blkid -s TYPE -o value "$p" 2>/dev/null || echo "unknown")
            echo "  $p -> $FSTYPE"
          done

          PART=$(lsblk -nrpo NAME,FSTYPE /dev/nbd0 2>/dev/null | grep ext4 | head -1 | awk '{print $1}')
          if [ -z "$PART" ]; then
            PART="/dev/nbd0p1"
          fi
          echo "Using partition: $PART"

          sudo mkdir -p /mnt/image
          sudo mount "$PART" /mnt/image

          echo "Installing prowl..."
          sudo cp prowl-linux-amd64 /mnt/image/usr/local/bin/prowl
          sudo chmod +x /mnt/image/usr/local/bin/prowl
          sudo ls -la /mnt/image/usr/local/bin/prowl

          echo "Bundling bounty-data..."
          sudo mkdir -p /mnt/image/home/kali/.prowl/bounty-data
          sudo cp -r data/bounty-data/* /mnt/image/home/kali/.prowl/bounty-data/
          sudo chown -R 1000:1000 /mnt/image/home/kali/.prowl

          echo "Unmounting..."
          sudo umount /mnt/image
          sudo qemu-nbd --disconnect /dev/nbd0

      - name: Compress image
        run: |
          echo "Converting to final QCOW2..."
          qemu-img convert -f qcow2 -O qcow2 -c \
            -o compression_type=zlib,cluster_size=65536 \
            "build/images/prowl-kali.qcow2" \
            "${{ env.OUTPUT_NAME }}.qcow2"

          echo "Final size: $(du -h ${{ env.OUTPUT_NAME }}.qcow2 | cut -f1)"

      - name: Split for GitHub release
        run: |
          mkdir -p splits
          rm -f splits/*
          split -b 1800M -d -a 3 \
            "${{ env.OUTPUT_NAME }}.qcow2" \
            "splits/${{ env.OUTPUT_NAME }}.part."

          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          echo "Split into $PARTS parts, total: $SIZE"

      - name: Generate manifest
        run: |
          PARTS=$(ls splits/*.part.* | wc -l)
          SIZE=$(du -sh splits | cut -f1)
          cat > splits/manifest.json << EOF
          {
            "name": "${{ env.OUTPUT_NAME }}",
            "version": "${{ github.ref_name || 'dev' }}",
            "commit": "$(git rev-parse --short HEAD)",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "parts": $PARTS,
            "max_part_size": "1800M",
            "total_size": "$SIZE",
            "desktop": "${{ github.event.inputs.desktop || 'xfce' }}"
          }
          EOF

      - name: Upload parts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-image
          path: splits/
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            splits/${{ env.OUTPUT_NAME }}.part.*
            splits/manifest.json
          body: |
            ## Prowl Kali Image ${{ github.ref_name }}

            Minimal Kali Linux QEMU image built with debootstrap. Only exactly what's needed — no bloat.

            Desktop: ${{ github.event.inputs.desktop || 'xfce' }}

            ### Quick Start
            ```bash
            # Reassemble
            cat ${{ env.OUTPUT_NAME }}.part.* > ${{ env.OUTPUT_NAME }}.qcow2

            # Run
            qemu-system-x86_64 -m 4G -smp 2 -enable-kvm \
              -drive file=${{ env.OUTPUT_NAME }}.qcow2,format=qcow2 \
              -net user,hostfwd=tcp::2222-:22 -net nic

            # SSH
            sshpass -p kali ssh -p 2222 kali@localhost
            ```
          draft: false
          prerelease: false

      - name: Cleanup
        if: always()
        run: |
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          sudo umount /mnt/image 2>/dev/null || true
          sudo rm -rf build/ splits/ *.qcow2
